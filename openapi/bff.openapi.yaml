        tokens OAuth. Usar Cache-Control: no-store.\n"

  # =========================
  # Accounts
  # =========================
  /api/v1/accounts:
    get:
      tags: [Accounts]
      operationId: getAccountsOverview
      summary: Resumen de cuentas del customer autenticado
      security:
        - cookieAuth: []
      description: |-
        Lista únicamente las cuentas del cliente autenticado. customer_id se obtiene de la sesión, nunca de parámetros controlados por el navegador. Los balances son proyecciones eventualmente consistentes.
      x-grpc:
        service: bank.accounts.v1.AccountsService
        method: ListAccounts
      x-bff-orchestration:
        calls:
          - service: identity
            rpc: OidcAuthService.GetSessionInfo
            when: "conditional"
            notes: "Si el BFF no tiene customer_id en cache."
          - service: identity
            rpc: OidcAuthService.RefreshSession
            when: "conditional"
            notes: "Si no hay access_token válido para llamar Accounts."
          - service: accounts
            rpc: AccountsService.ListAccounts
            when: always
            notes: "Retorna lista con balances."
      x-audit:
        action: accounts.list
        route_template: /api/v1/accounts
        critical: false
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/X-Correlation-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountsOverviewResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Forbidden
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Upstream error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /api/v1/accounts/{id}/limits:
    patch:
      tags: [Accounts]
      operationId: patchAccountLimits
      summary: Actualiza límites diarios de la cuenta
      security:
        - cookieAuth: []
          csrfAuth: []
      description: |-
        Actualiza límites diarios de una cuenta autorizada. El servicio Accounts verifica ownership/autorización. No se promete idempotencia por clave mientras el contrato gRPC y la implementación no la soporten; establecer el mismo valor puede ser semánticamente idempotente.
      x-grpc:
        service: bank.accounts.v1.AccountsService
        method: PatchAccountLimits
      x-bff-orchestration:
        calls:
          - service: identity
            rpc: OidcAuthService.RefreshSession
            when: "conditional"
            notes: "Si no hay access_token válido para downstream."
          - service: accounts
            rpc: AccountsService.PatchAccountLimits
            when: always
            notes: "Se recomienda propagar Idempotency-Key como metadata y/o campo idempotency_key."
      x-audit:
        action: accounts.limits.patch
        route_template: /api/v1/accounts/{id}/limits
        critical: true
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PatchAccountLimitsHttpRequest'}
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/X-Correlation-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PatchAccountLimitsHttpResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Forbidden
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Upstream error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}


  /api/v1/accounts/lookup:
    get:
      tags: [Accounts]
      operationId: lookupAccountByNumber
      summary: Consulta cuenta por número de cuenta (account_number)
      security:
        - cookieAuth: []
      description: |-
        Resuelve un account_number para confirmar una transferencia. Solo los datos mínimos permitidos del titular deben revelarse. Requiere protección contra enumeración masiva y autorización en Accounts.
      x-grpc:
        service: bank.accounts.v1.AccountsService
        method: GetAccountByNumber
      x-bff-orchestration:
        calls:
          - service: identity
            rpc: OidcAuthService.RefreshSession
            when: "conditional"
            notes: "Si no hay access_token válido para downstream."
          - service: accounts
            rpc: AccountsService.GetAccountByNumber
            when: always
            notes: "Devuelve account_id + display_name + currency + status."
      x-audit:
        action: accounts.lookup
        route_template: /api/v1/accounts/lookup
        critical: false
      parameters:
        - in: query
          name: account_number
          required: true
          schema:
            type: string
            pattern: '^\d{1,12}$'
          description: "Número de cuenta (1..12 dígitos). Se preservan ceros a la izquierda."
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/X-Correlation-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountLookupResponse'}
        '400':
          description: Bad request (formato inválido)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Forbidden
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Not found (no existe)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Upstream error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /api/v1/accounts/{id}/statement:
    get:
      tags: [Accounts]
      operationId: getAccountStatement
      summary: Estado de cuenta / movimientos (statement)
      security:
        - cookieAuth: []
      description: |
        Devuelve movimientos de una cuenta autorizada. BFF valida sesión y formato;
        LedgerService valida titularidad/autorización de la cuenta y consulta movimientos.
        Cuando include_counterparty=true, Ledger puede enriquecer con InternalAccountsService.BatchGetAccountSummaries.
        La operación no existe en AccountsService.
      x-grpc:
        service: bank.ledgerpayments.v1.LedgerService
        method: ListAccountStatement
      x-bff-orchestration:
        calls:
          - service: identity
            rpc: OidcAuthService.RefreshSession
            when: "conditional"
            notes: "Si no hay access_token válido para downstream."
          - service: ledgerpayments
            rpc: LedgerService.ListAccountStatement
            when: always
            notes: "Ledger es responsable de validar acceso y servir los movimientos."
      x-audit:
        action: accounts.statement.list
        route_template: /api/v1/accounts/{id}/statement
        critical: false
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string, format: uuid}
        - in: query
          name: from
          required: false
          schema: {type: string, format: date-time}
          description: "Inicio del rango (RFC3339)."
        - in: query
          name: to
          required: false
          schema: {type: string, format: date-time}
          description: "Fin del rango (RFC3339)."
        - $ref: '#/components/parameters/PageParam'
        - $ref: '#/components/parameters/SizeParam'
        - in: query
          name: include_counterparty
          required: false
          schema: {type: boolean, default: false}
          description: "Si true, devuelve counterparty enriquecido."
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/X-Correlation-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AccountStatementResponse'}
        '400':
          description: Bad request (rango/params inválidos)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Forbidden
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Upstream error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '404':
          description: Cuenta o movimientos no accesibles/inexistentes, según política de no divulgación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  # =========================
  # Onboarding
  # =========================
  /api/v1/onboarding/intents:
    post:
      tags: [Onboarding]
      operationId: startOnboarding
      summary: Inicia onboarding (registro/KYC) — presigned S3
      description: |
        Orquestación:
        - Identity.StartRegistration crea registration_id y retorna presigned uploads.
        Idempotencia:
        - Recomendado Idempotency-Key (si el cliente reintenta por timeouts).

        No se promete deduplicación por Idempotency-Key mientras no exista soporte persistente en Identity.
      x-grpc:
        service: bank.identity.v1.OnboardingService
        method: StartRegistration
      x-bff-orchestration:
        calls:
          - service: identity
            rpc: OnboardingService.StartRegistration
            when: always
            notes: "Retorna presigned uploads; el cliente sube directo a S3."
      x-audit:
        action: onboarding.intent.create
        route_template: /api/v1/onboarding/intents
        critical: true
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OnboardingIntentRequest'}
      responses:
        '201':
          description: Created
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/X-Correlation-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OnboardingIntentResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Schema validation failed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Upstream error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /api/v1/onboarding/kyc/confirm:
    post:
      tags: [Onboarding]
      operationId: confirmOnboardingKyc
      summary: Confirma KYC (verifica objetos subidos a S3)
      description: |
        Orquestación:
        - Identity.ConfirmRegistrationKyc valida objetos vía HeadObject/ETag y marca confirmación.
        Idempotencia:
        - Recomendado Idempotency-Key en reintentos.

        No se promete deduplicación por Idempotency-Key mientras no exista soporte persistente en Identity.
      x-grpc:
        service: bank.identity.v1.OnboardingService
        method: ConfirmRegistrationKyc
      x-bff-orchestration:
        calls:
          - service: identity
            rpc: OnboardingService.ConfirmRegistrationKyc
            when: always
            notes: "Verifica bucket/key/etag y retorna status por doc."
      x-audit:
        action: onboarding.kyc.confirm
        route_template: /api/v1/onboarding/kyc/confirm
        critical: true
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ConfirmKycRequest'}
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/X-Correlation-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ConfirmKycResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Schema validation failed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Upstream error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /api/v1/onboarding/activate:
    post:
      tags: [Onboarding]
      operationId: activateOnboarding
      summary: Activa onboarding (crea customer + account)
      description: |-
        Activa un registro KYC confirmado mediante Identity.ActivateRegistration. Identity coordina la creación de customer y una cuenta inicial por el servicio interno Accounts; el bono demo se acredita una sola vez mediante Ledger. La clave HTTP de idempotencia se valida en BFF; la deduplicación durable de la operación se basa en registration_id/activation_ref y se verifica en Identity/Accounts/Ledger. No se reenvía Idempotency-Key en el mensaje Proto actual porque no contiene ese campo. El saldo proyectado puede actualizarse posteriormente.
      x-grpc:
        service: bank.identity.v1.OnboardingService
        method: ActivateRegistration
      x-bff-orchestration:
        calls:
          - service: identity
            rpc: OnboardingService.ActivateRegistration
            when: always
            notes: "Identity orquesta Accounts/Ledger internamente."
      x-audit:
        action: onboarding.activate
        route_template: /api/v1/onboarding/activate
        critical: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ActivateRequest'}
      responses:
        '201':
          description: Created
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/X-Correlation-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ActivateResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Schema validation failed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Upstream error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Conflicto de activación o reintento con datos inconsistentes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/payments:
    post:
      tags: [Payments]
      operationId: executePayment
      summary: Ejecuta un pago
      security:
        - cookieAuth: []
          csrfAuth: []
      description: |-
        El BFF valida formato y sesión, obtiene identidad autenticada y llama a PaymentsService.PostPayment. La autorización definitiva de cuentas, fondos, límites, hold, journal, outbox e idempotencia se ejecuta en Payments/Accounts. No se invoca InternalAccountsService desde el BFF. Los montos se envían como cadenas decimales exactas.
      x-grpc:
        service: bank.ledgerpayments.v1.PaymentsService
        method: PostPayment
      x-bff-orchestration:
        calls:
          - service: identity
            rpc: OidcAuthService.RefreshSession
            when: "conditional"
            notes: "Si no hay access_token válido."
          - service: payments
            rpc: PaymentsService.PostPayment
            when: always
            notes: "Transmite Idempotency-Key y token de usuario; Payments valida recurso, fondos, límites y contabilización."
      x-audit:
        action: payments.create
        route_template: /api/v1/payments
        critical: true
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyRequired'
        - $ref: '#/components/parameters/XCsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreatePaymentRequest'}
      responses:
        '201':
          description: Created
          headers:
            X-Correlation-Id: {$ref: '#/components/headers/X-Correlation-Id'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CreatePaymentResponse'}
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Forbidden
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '422':
          description: Schema validation failed
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Upstream error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '409':
          description: Idempotency-Key reutilizada con contenido diferente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/payments/{id}:
    get:
      tags: [Payments]
      operationId: getPaymentStatus
      summary: Obtiene estado/detalle de un pago
      security:
        - cookieAuth: []
      x-grpc:
        service: bank.ledgerpayments.v1.PaymentsService
        method: GetPayment
      x-bff-orchestration:
