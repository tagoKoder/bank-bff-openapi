      description: |
        Orquestación (BFF):
        - BFF verifica autorización/ownership del account_id (policy/AVP y/o Accounts).
        - BFF llama a Accounts.ListAccountStatement(...).
        Orquestación (Accounts, interno):
        - Accounts consulta a LedgerService.ListAccountStatement para obtener movimientos.
        - Si include_counterparty=true, Ledger puede enriquecer con InternalAccountsService.BatchGetAccountSummaries.
