openapi: 3.0.3
info:
  title: BFF Web API
  version: 1.1.0
  description: |
    API REST pública del BFF para el canal web de Imaginary Bank.
    El navegador solo utiliza sesión mediante cookie HttpOnly y protección CSRF;
    los tokens OAuth/OIDC permanecen en el lado servidor.
    Las operaciones gRPC se consumen desde el módulo GitHub bank-contracts.
    Los importes monetarios se representan como cadenas decimales exactas, nunca float/double.
    La autorización sobre cada recurso se verifica en el microservicio propietario,
    incluso cuando el BFF realice comprobaciones adicionales.
    La contabilización y las proyecciones de saldos pueden presentar consistencia eventual.

servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: Auth
  - name: Session
  - name: Onboarding
  - name: Accounts
  - name: Payments
  - name: Profile
  - name: Admin

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: bff_sid
      description: >-
        Cookie de sesión web. Nombre local: bff_sid; en HTTPS de producción: __Host-bff_sid. El runtime del BFF
        debe aceptar solo el nombre configurado para el entorno. Se requiere HttpOnly y Secure en producción; nunca
        exponer access tokens al navegador.
    csrfAuth:
      type: apiKey
      in: header
      name: X-CSRF-Token

      description: Token CSRF vinculado a la sesión, requerido para operaciones autenticadas que cambian 
        estado.
  headers:
    X-Correlation-Id:
      description: Identificador de correlación propagado sin incluir credenciales ni datos personales.
      schema:
        type: string
    Idempotency-Key:
      description: Identificador de solicitud para detección de reintentos. La lógica de negocio debe aplicar 
        la idempotencia de forma persistente; exigir el header por sí solo no es suficiente.
      schema:
        type: string

  parameters:
    XCsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema: {type: string}
    IdempotencyKeyRequired:
      in: header
      name: Idempotency-Key
      required: true
      schema: {type: string, minLength: 8, maxLength: 128}
      description: Clave estable por operación; reintentos usan la misma clave, solicitudes distintas usan 
        claves distintas.

    IdempotencyKeyOptional:
      in: header
      name: Idempotency-Key
      required: false
      schema: {type: string, minLength: 8, maxLength: 128}
    PageParam:
      in: query
      name: page
      required: false
      schema: {type: integer, minimum: 1, default: 1}
    SizeParam:
      in: query
      name: size
      required: false
      schema: {type: integer, minimum: 1, maximum: 200, default: 20}

  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "BAD_REQUEST"
        message:
          type: string
          example: "Invalid request"
        details:
          type: object
          additionalProperties: true
          nullable: true

    CsrfTokenResponse:
      type: object
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          example: "4f2c1a...csrf..."

    SimpleStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # =========================
    # Accounts
    # =========================
    AccountsOverviewResponse:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountItem'

    AccountItem:
      type: object
      required: [id, product_type, currency, status, balances]
      properties:
        id: {type: string}
        account_number:
          type: string
          example: "000000012345"
          description: "Número de cuenta, preservando ceros a la izquierda; 12 dígitos en el entorno demo."
        product_type: {type: string, description: "Ej: CHECKING | SAVINGS"}
        currency: {type: string, description: "ISO-4217"}
        status: {type: string, example: "active"}
        balances:
          $ref: '#/components/schemas/AccountBalances'

    AccountBalances:
      type: object
      required: [ledger, available, hold]
      properties:
        ledger:
          type: string
          description: "Decimal string"
        available:
          type: string
          description: "Decimal string"
        hold:
          type: string
          description: "Decimal string"

      description: Proyección eventualmente consistente desde eventos de Ledger. Los tres campos son cadenas 
        decimales exactas.
    PatchAccountLimitsHttpRequest:
      type: object
      description: |-
        Actualiza límites diarios. Campo omitido o null: no modificar. Valores como cadenas decimales no negativas (hasta 6 decimales). La implementación actual debe alinearse con esta semántica.
      properties:
        daily_out:
          type: string
          nullable: true
          description: "Decimal string (>=0). Ej: '500.00'"
          pattern: ^(0|[1-9][0-9]{0,13})(\.[0-9]{1,6})?$
        daily_in:
          type: string
          nullable: true
          description: "Decimal string (>=0). Ej: '1000.00'"

          pattern: ^(0|[1-9][0-9]{0,13})(\.[0-9]{1,6})?$
    PatchAccountLimitsHttpResponse:
      type: object
      required: [account_id, daily_out, daily_in]
      properties:
        account_id: {type: string}
        daily_out: {type: string}
        daily_in: {type: string}

    # -------------------------
    # NUEVO: Lookup por account_number (destinatario)
    # -------------------------
    AccountLookupResponse:
      type: object
      required: [account]
      properties:
        account:
          $ref: '#/components/schemas/AccountLookupItem'

    AccountLookupItem:
      type: object
      required: [account_id, account_number, display_name, product_type, currency, status]
      properties:
        account_id: {type: string, format: uuid}
        account_number:
          type: string
          example: "000000012345"
          description: "Número de cuenta normalizado (12 dígitos)."
        display_name:
          type: string
          example: "Juan Perez"
          description: "Nombre de presentación limitado para la confirmación del destinatario, sujeto a políticas
            de privacidad y prevención de enumeración."
        product_type:
          type: string
          example: "CHECKING"
        currency:
          type: string
          minLength: 3
          maxLength: 3
        status:
          type: string
          example: "active"

    # -------------------------
    # NUEVO: Estado de cuenta / Movimientos (Statement)
    # -------------------------
    AccountStatementResponse:
      type: object
      required: [items, page, size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StatementItem'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          nullable: true
          description: "Opcional si no hay total disponible."

      description: Movimientos autorizados del ledger. page es 1-based. total puede omitirse si Ledger no lo 
        proporciona.
    StatementItem:
      type: object
      required: [journal_id, booked_at, currency, direction, amount, kind]
      properties:
        journal_id:
          type: string
          description: "Journal/entry id del ledger"
        booked_at:
          type: string
          format: date-time
        currency:
          type: string
          minLength: 3
          maxLength: 3
        direction:
          type: string
          enum: [debit, credit]
        amount:
          type: string
          description: "Decimal string"
        kind:
          type: string
          example: "transfer"
        memo:
          type: string
          nullable: true
          description: "Referencia externa / external_ref"
        counterparty_account_id:
          type: string
          nullable: true
          format: uuid
        counterparty:
          $ref: '#/components/schemas/CounterpartyView'
          nullable: true

    CounterpartyView:
      type: object
      required: [account_id, account_number, display_name, account_type]
      properties:
        account_id: {type: string, format: uuid}
        account_number: {type: string, example: "000000009999"}
        display_name: {type: string, example: "Maria Lopez"}
        account_type: {type: string, example: "checking"}

    # =========================
    # Onboarding (Presigned S3)
    # =========================
    OccupationType:
      type: string
      enum: [student, employee, self_employed, unemployed, retired]

    RegistrationState:
      type: string
      enum: [started, contact_verified, consented, activated, rejected, unspecified]

    KycDocType:
      type: string
      enum: [id_front, selfie]

    KycUploadStatus:
      type: string
      enum: [pending, confirmed, unspecified]

    PresignedHeader:
      type: object
      required: [name, value]
      properties:
        name: {type: string}
        value: {type: string}

    PresignedUpload:
      type: object
      required: [doc_type, bucket, key, upload_url, headers, max_bytes, content_type, expires_in_seconds]
      properties:
        doc_type: {$ref: '#/components/schemas/KycDocType'}
        bucket: {type: string}
        key: {type: string}
        upload_url:
          type: string
          format: uri
        headers:
          type: array
          items: {$ref: '#/components/schemas/PresignedHeader'}
        max_bytes:
          type: integer
          format: int64
        content_type: {type: string}
        expires_in_seconds:
          type: integer
          format: int64

    OnboardingIntentRequest:
      type: object
      required:
        - email
        - phone
        - national_id
        - national_id_issue_date
        - fingerprint_code
        - monthly_income
        - occupation_type
      properties:
        email: {type: string, format: email}
        phone: {type: string}
        channel:
          type: string
          nullable: true
          description: "Ej: web"
        locale:
          type: string
          nullable: true

        national_id: {type: string}
        national_id_issue_date:
          type: string
          example: "2020-01-31"
        fingerprint_code: {type: string}

        monthly_income:
          type: string
          pattern: ^(0|[1-9][0-9]{0,13})(\.[0-9]{1,6})?$
          description: Ingreso mensual como cadena decimal exacta, no JSON number.
        occupation_type:
          $ref: '#/components/schemas/OccupationType'

        id_front_content_type:
          type: string
          nullable: true
          example: "image/jpeg"
        selfie_content_type:
          type: string
          nullable: true
          example: "image/jpeg"

    OnboardingIntentResponse:
      type: object
      required: [registration_id, state, uploads]
      properties:
        registration_id: {type: string}
        state: {$ref: '#/components/schemas/RegistrationState'}
        created_at:
          type: string
          format: date-time
          nullable: true
        uploads:
          type: array
          items: {$ref: '#/components/schemas/PresignedUpload'}
        correlation_id:
          type: string
          nullable: true

    UploadedObject:
      type: object
      required: [doc_type, bucket, key]
      properties:
        doc_type: {$ref: '#/components/schemas/KycDocType'}
        bucket: {type: string}
        key: {type: string}
        etag:
          type: string
          nullable: true
        size_bytes:
          type: integer
          format: int64
          nullable: true
        content_type:
          type: string
          nullable: true

    ConfirmKycRequest:
      type: object
      required: [registration_id, objects]
      properties:
        registration_id: {type: string}
        channel:
          type: string
          nullable: true
          description: "Ej: web"
        objects:
          type: array
          items: {$ref: '#/components/schemas/UploadedObject'}

    KycObjectStatus:
      type: object
      required: [doc_type, status, bucket, key]
      properties:
        doc_type: {$ref: '#/components/schemas/KycDocType'}
        status: {$ref: '#/components/schemas/KycUploadStatus'}
        bucket: {type: string}
        key: {type: string}
        etag:
          type: string
          nullable: true

    ConfirmKycResponse:
      type: object
      required: [registration_id, state, statuses]
      properties:
        registration_id: {type: string}
        state: {$ref: '#/components/schemas/RegistrationState'}
        statuses:
          type: array
          items: {$ref: '#/components/schemas/KycObjectStatus'}
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        correlation_id:
          type: string
          nullable: true

    ActivateRequest:
      type: object
      required: [registration_id, full_name, tin, birth_date, country, email, phone, accepted_terms]
      properties:
        registration_id: {type: string}
        full_name: {type: string}
        tin: {type: string}
        birth_date: {type: string, example: "1999-12-31"}
        country: {type: string, minLength: 2, maxLength: 2}
        email: {type: string, format: email}
        phone: {type: string}
        accepted_terms:
          type: boolean
          enum:
            - true
          description: El usuario debe aceptar expresamente los términos antes de activar su registro.
    ActivateResponse:
      type: object
      required: [customer_id, account_id, activation_ref]
      properties:
        customer_id: {type: string}
        account_id: {type: string}
        activation_ref: {type: string}
        correlation_id:
          type: string
          nullable: true

    # =========================
    # Payments
    # =========================
      description: La activación se identifica establemente con activation_ref. El bono promocional demo se 
        otorga una sola vez por cliente; el saldo puede reflejarlo después de procesar el evento contable.

    CreatePaymentRequest:
      type: object
      required: [source_account, destination_account, currency, amount]
      properties:
        source_account: {type: string, description: UUID de cuenta; no usar account_number como identificador 
            de PostPayment.}
        destination_account: {type: string, description: UUID de cuenta; no usar account_number como 
            identificador de PostPayment.}
        currency: {type: string, minLength: 3, maxLength: 3}
        amount:
          type: string
          description: "Cadena decimal estrictamente positiva (hasta 6 decimales); la validación numérica final
            es responsabilidad de Payments."
          pattern: ^(0|[1-9][0-9]{0,13})(\.[0-9]{1,6})?$
        memo:
          type: string
          nullable: true

    CreatePaymentResponse:
      type: object
      required: [payment_id, status]
      properties:
        payment_id: {type: string}
        status:
          type: string
          enum:
            - processing
            - posted
            - failed
          description: Estado reportado por PaymentsService.PostPayment; no mapear processing a pending sin 
            definirlo en el contrato.

    PaymentStep:
      type: object
      required: [step, state, attempted_at]
      properties:
        step: {type: string}
        state: {type: string}
        details_json:
          type: string
          nullable: true
        attempted_at:
          type: string
          format: date-time

    GetPaymentResponse:
      type: object
      required: [payment_id, status, source_account, destination_account, currency, amount, steps, created_at]
      properties:
        payment_id: {type: string}
        status: {type: string, description: Estado real de la operación según PaymentsService.GetPayment.}
        source_account: {type: string}
        destination_account: {type: string}
        currency: {type: string}
        amount: {type: string}
        steps:
          type: array
          items: {$ref: '#/components/schemas/PaymentStep'}
        created_at:
          type: string
          format: date-time

    # =========================
    # Profile
    # =========================
    PatchProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        preferences:
          type: array
          nullable: true
          items:
            type: object
            required: [channel, opt_in]
            properties:
              channel:
                type: string
                enum: [email, sms, push]
              opt_in:
                type: boolean

    PatchProfileResponse:
      type: object
      required: [updated]
      properties:
        updated:
          type: boolean

    # =========================
    # Session / Whoami
    # =========================
    WhoamiResponse:
      type: object
      required: [subject_id_oidc, roles, user_status]
      properties:
        subject_id_oidc: {type: string}
        customer_id:
          type: string
          nullable: true
        roles:
          type: array
          items: {type: string}
        user_status: {type: string}

    RefreshSessionResponse:
      type: object
      required: [session_expires_in]
      properties:
        session_expires_in:
          type: integer
          format: int64
          description: "TTL de la sesión (segundos). Cookie rotada/extendida."

paths:
  # =========================
  # AUTH
  # =========================
  /api/v1/auth/oidc/start:
    get:
      tags: [Auth]
      operationId: startWebLogin
      summary: Inicia OIDC login y redirige al IdP
      description: |
        Orquestación:
        - BFF llama a Identity para obtener authorization_url.
        - BFF responde 302 Location.
      x-grpc:
        service: bank.identity.v1.OidcAuthService
        method: StartOidcLogin
      x-bff-orchestration:
        calls:
          - service: identity
            rpc: OidcAuthService.StartOidcLogin
            when: always
            notes: "Devuelve authorization_url y state."
      x-audit:
        action: auth.oidc.start
        route_template: /api/v1/auth/oidc/start
        critical: false
      parameters:
        - in: query
          name: redirect
          required: false
          schema: {type: string}
          description: "Path destino post-login (ej: /home)"
      responses:
        '302':
          description: Redirect to IdP authorization endpoint
          headers:
            Location:
              schema: {type: string}
              required: true
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        '400':
          description: Bad request
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /api/v1/auth/oidc/callback:
    get:
      tags: [Auth]
      operationId: completeWebLogin
      summary: Callback OIDC; crea cookie de sesión y redirige al destino final
      description: |
        Orquestación:
        - BFF llama a Identity.CompleteOidcLogin(code,state,...).
        - BFF setea cookie session_id y materializa CSRF (cookie/endpoint /session/csrf).
        - BFF redirige a redirect_after_login.
      x-grpc:
        service: bank.identity.v1.OidcAuthService
        method: CompleteOidcLogin
      x-bff-orchestration:
        calls:
          - service: identity
            rpc: OidcAuthService.CompleteOidcLogin
            when: always
            notes: "Crea sesión server-side y retorna session_id + redirect."
      x-audit:
        action: auth.oidc.complete
        route_template: /api/v1/auth/oidc/callback
        critical: true
      parameters:
        - in: query
          name: code
          required: true
          schema: {type: string}
        - in: query
          name: state
          required: true
          schema: {type: string}
      responses:
        '302':
          description: Redirect after login (sets session cookie and CSRF cookie)
          headers:
            Location:
              schema: {type: string}
              required: true
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        '400':
          description: Missing/invalid parameters
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '401':
          description: Unauthorized (invalid code/state or login rejected)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  # =========================
  # SESSION
  # =========================
  /api/v1/session/logout:
    post:
      tags: [Session]
      operationId: logoutWebSession
      summary: Cierra sesión y limpia cookies
      security:
        - cookieAuth: []
          csrfAuth: []
      x-grpc:
        service: bank.identity.v1.OidcAuthService
        method: LogoutSession
      x-bff-orchestration:
        calls:
          - service: identity
            rpc: OidcAuthService.LogoutSession
            when: always
            notes: "Invalida sesión server-side."
      x-audit:
        action: session.logout
        route_template: /api/v1/session/logout
        critical: true
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '204':
          description: No Content
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Forbidden (CSRF / session)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      description: "\nLas credenciales y access tokens permanecen en el servidor; las respuestas HTTP no incluyen
        tokens OAuth. Usar Cache-Control: no-store.\n"

  /api/v1/session/csrf:
    get:
      tags: [Session]
      operationId: getWebCsrfToken
      summary: Devuelve el CSRF token actual (o lo crea si no existe)
      security:
        - cookieAuth: []
      x-bff-orchestration:
        calls:
          - service: bff
            rpc: none
            when: always
            notes: "CSRF token se gestiona en BFF (cookie/secret) y se devuelve al cliente."
      x-audit:
        action: session.csrf.get
        route_template: /api/v1/session/csrf
        critical: false
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CsrfTokenResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Forbidden (CSRF / session)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}

  /api/v1/session/refresh:
    post:
      tags: [Session]
      operationId: refreshWebSession
      summary: Rota/renueva sesión server-side y actualiza cookie
      security:
        - cookieAuth: []
          csrfAuth: []
      x-grpc:
        service: bank.identity.v1.OidcAuthService
        method: RefreshSession
      x-bff-orchestration:
        calls:
          - service: identity
            rpc: OidcAuthService.RefreshSession
            when: always
            notes: "Rota sesión y devuelve access_token para downstream."
      x-audit:
        action: session.refresh
        route_template: /api/v1/session/refresh
        critical: true
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RefreshSessionResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
          description: Forbidden (CSRF / session)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
      description: "\nLas credenciales y access tokens permanecen en el servidor; las respuestas HTTP no incluyen
        tokens OAuth. Usar Cache-Control: no-store.\n"

  /api/v1/session:
    get:
      tags: [Session]
      operationId: getCurrentSession
      summary: Identidad y estado de la sesión actual
      security:
        - cookieAuth: []
      x-grpc:
        service: bank.identity.v1.OidcAuthService
        method: GetSessionInfo
      x-bff-orchestration:
        calls:
          - service: identity
            rpc: OidcAuthService.GetSessionInfo
            when: always
            notes: "Devuelve roles + customer_id (si ya está ligado)."
          - service: identity
            rpc: OidcAuthService.RefreshSession
            when: "conditional"
            notes: "Si access_token expiró y se requiere downstream."
      x-audit:
        action: session.info
        route_template: /api/v1/session
        critical: false
      responses:
        '200':
          description: OK
