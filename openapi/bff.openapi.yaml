      tags: [Onboarding]
      operationId: activateOnboarding
      summary: Activa onboarding (crea customer + account)
      description: |
        Orquestación (BFF):
        - BFF llama a Identity.ActivateRegistration.
        Orquestación (Identity, interno):
        - Valida estado del registration_id (KYC confirmado, etc).
        - Crea/obtiene customer en Accounts (external_ref = registration_id).
        - Crea cuenta(s) en Accounts (idempotente por external_ref).
        - (Opcional) aplica bonus en Ledger.
        Idempotencia:
        - Requerido Idempotency-Key; si el cliente reintenta, debe devolver la misma activation_ref.
      x-grpc:
        service: bank.identity.v1.OnboardingService
        method: ActivateRegistration
      x-bff-orchestration:
        calls:
          - service: identity
            rpc: OnboardingService.ActivateRegistration
            when: always
            notes: "Identity orquesta Accounts/Ledger internamente."
