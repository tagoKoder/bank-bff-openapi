              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/WhoamiResponse'}
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ErrorResponse'}
        '403':
