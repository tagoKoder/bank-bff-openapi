openapi: 3.0.3
info:
  title: BFF Web API
  version: 1.0.0
  description: |
    API del BFF para canal web (cookie session + CSRF).
    Onboarding usa flujo presigned S3 (no se suben bytes al BFF).

servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: Auth
  - name: Session
  - name: Onboarding
  - name: Accounts
  - name: Payments
  - name: Profile
  - name: Admin

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_id
      description: >
        En HTTPS el BFF puede setear __Host-session_id; en local/HTTP usa session_id.
        El cliente debe reenviar la cookie exactamente como la recibe.
    csrfAuth:
      type: apiKey
      in: header
      name: X-CSRF-Token

  headers:
    Idempotency-Key:
      schema:
        type: string
      required: true

  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "BAD_REQUEST"
        message:
          type: string
          example: "Invalid request"
        details:
          type: object
          additionalProperties: true
          nullable: true

    CsrfTokenResponse:
      type: object
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          example: "4f2c1a...csrf..."

    # =========================
    # Accounts
    # =========================
    AccountsOverviewResponse:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountItem'

    AccountItem:
      type: object
      required: [id, product_type, currency, status, balances]
      properties:
        id:
          type: string
        product_type:
          type: string
        currency:
          type: string
        status:
          type: string
        balances:
          $ref: '#/components/schemas/AccountBalances'

    AccountBalances:
      type: object
      required: [ledger, available, hold]
      properties:
        ledger:
          type: string
        available:
          type: string
        hold:
          type: string

    AccountActivityResponse:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountActivityItem'
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer

    AccountActivityItem:
      type: object
      required: [journal_id, booked_at]
      properties:
        journal_id:
          type: string
        booked_at:
          type: string
          format: date-time
        memo:
          type: string
          nullable: true

    # =========================
    # Onboarding (Presigned S3)
    # =========================
    OccupationType:
      type: string
      enum: [student, employee, self_employed, unemployed, retired]

    RegistrationState:
      type: string
      enum: [started, contact_verified, consented, activated, rejected, unspecified]

    KycDocType:
      type: string
      enum: [id_front, selfie]

    KycUploadStatus:
      type: string
      enum: [pending, confirmed, unspecified]

    PresignedHeader:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
        value:
          type: string

    PresignedUpload:
      type: object
      required: [doc_type, bucket, key, upload_url, headers, max_bytes, content_type, expires_in_seconds]
      properties:
        doc_type:
          $ref: '#/components/schemas/KycDocType'
        bucket:
          type: string
        key:
          type: string
        upload_url:
          type: string
          format: uri
        headers:
          type: array
          items:
            $ref: '#/components/schemas/PresignedHeader'
        max_bytes:
          type: integer
          format: int64
        content_type:
          type: string
        expires_in_seconds:
          type: integer
          format: int64

    OnboardingIntentRequest:
      type: object
      required:
        - email
        - phone
        - national_id
        - national_id_issue_date
        - fingerprint_code
        - monthly_income
        - occupation_type
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        channel:
          type: string
          nullable: true
          description: "Ej: web"
        locale:
          type: string
          nullable: true

        national_id:
          type: string
        national_id_issue_date:
          type: string
          example: "2020-01-31"
        fingerprint_code:
          type: string

        monthly_income:
          type: number
        occupation_type:
          $ref: '#/components/schemas/OccupationType'

        # Hints opcionales para content-type esperado al emitir presigned
        id_front_content_type:
          type: string
          nullable: true
          example: "image/jpeg"
        selfie_content_type:
          type: string
          nullable: true
          example: "image/jpeg"

    OnboardingIntentResponse:
      type: object
      required: [registration_id, state, uploads]
      properties:
        registration_id:
          type: string
        state:
          $ref: '#/components/schemas/RegistrationState'
        created_at:
          type: string
          format: date-time
          nullable: true
        uploads:
          type: array
          items:
            $ref: '#/components/schemas/PresignedUpload'
        otp_channel_hint:
          type: string
          nullable: true
          description: "Legacy/compat. Puede omitirse."

    UploadedObject:
      type: object
      required: [doc_type, bucket, key]
      properties:
        doc_type:
          $ref: '#/components/schemas/KycDocType'
        bucket:
          type: string
        key:
          type: string
        etag:
          type: string
          nullable: true
        size_bytes:
          type: integer
          format: int64
          nullable: true
        content_type:
          type: string
          nullable: true

    ConfirmKycRequest:
      type: object
      required: [registration_id, objects]
      properties:
        registration_id:
          type: string
        channel:
          type: string
          nullable: true
          description: "Ej: web"
        objects:
          type: array
          items:
            $ref: '#/components/schemas/UploadedObject'

    KycObjectStatus:
      type: object
      required: [doc_type, status, bucket, key]
      properties:
        doc_type:
          $ref: '#/components/schemas/KycDocType'
        status:
          $ref: '#/components/schemas/KycUploadStatus'
        bucket:
          type: string
        key:
          type: string
        etag:
          type: string
          nullable: true

    ConfirmKycResponse:
      type: object
      required: [registration_id, state, statuses]
      properties:
        registration_id:
          type: string
        state:
          $ref: '#/components/schemas/RegistrationState'
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/KycObjectStatus'
        confirmed_at:
          type: string
          format: date-time
          nullable: true

    ActivateRequest:
      type: object
      required: [registration_id, full_name, tin, birth_date, country, email, phone]
      properties:
        registration_id:
          type: string
        full_name:
          type: string
        tin:
          type: string
        birth_date:
          type: string
        country:
          type: string
        email:
          type: string
        phone:
          type: string

    ActivateResponse:
      type: object
      required: [customer_id, account_id, activation_ref]
      properties:
        customer_id:
          type: string
        account_id:
          type: string
        activation_ref:
          type: string

    # =========================
    # Payments
    # =========================
    CreateBeneficiaryRequest:
      type: object
      required: [destination_account]
      properties:
        destination_account:
          type: string
        alias:
          type: string
          nullable: true

    CreateBeneficiaryResponse:
      type: object
      required: [beneficiary_id]
      properties:
        beneficiary_id:
          type: string

    CreatePaymentRequest:
      type: object
      required: [source_account, destination_account, currency, amount]
      properties:
        source_account:
          type: string
        destination_account:
          type: string
        currency:
          type: string
        amount:
          type: string
        memo:
          type: string
          nullable: true

    CreatePaymentResponse:
      type: object
      required: [payment_id, status]
      properties:
        payment_id:
          type: string
        status:
          type: string
          enum: [pending, posted, rejected, failed]

    PaymentStep:
      type: object
      required: [step, state, attempted_at]
      properties:
        step:
          type: string
        state:
          type: string
        details_json:
          type: string
          nullable: true
        attempted_at:
          type: string
          format: date-time

    GetPaymentResponse:
      type: object
      required: [payment_id, status, idempotency_key, source_account, destination_account, currency, amount, steps, created_at]
      properties:
        payment_id:
          type: string
        status:
          type: string
        idempotency_key:
          type: string
        source_account:
          type: string
        destination_account:
          type: string
        currency:
          type: string
        amount:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/PaymentStep'
        created_at:
          type: string
          format: date-time

    # =========================
    # Profile
    # =========================
    PatchProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        preferences:
          type: array
          nullable: true
          items:
            type: object
            required: [channel, opt_in]
            properties:
              channel:
                type: string
                enum: [email, sms, push]
              opt_in:
                type: boolean

    PatchProfileResponse:
      type: object
      required: [updated]
      properties:
        updated:
          type: boolean

    # =========================
    # Admin Sandbox
    # =========================
    SandboxTopupRequest:
      type: object
      required: [account_id, currency, amount]
      properties:
        account_id:
          type: string
        currency:
          type: string
        amount:
          type: string
        memo:
          type: string
          nullable: true

    SandboxTopupResponse:
      type: object
      required: [journal_id, status]
      properties:
        journal_id:
          type: string
        status:
          type: string

    # =========================
    # Session / Whoami
    # =========================
    WhoamiResponse:
      type: object
      required: [subject_id_oidc, roles, user_status]
      properties:
        subject_id_oidc:
          type: string
        customer_id:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string
        user_status:
          type: string

    SimpleStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    RefreshSessionResponse:
      type: object
      required: [session_expires_in]
      properties:
        session_expires_in:
          type: integer
          format: int64
          description: "TTL de la sesión (segundos). Cookie rotada/extendida."

paths:
  # =========================
  # AUTH (ahora /api/v1)
  # =========================
  /api/v1/auth/oidc/start:
    get:
      tags: [Auth]
      operationId: startWebLogin
      summary: Inicia OIDC login y redirige al IdP
      parameters:
        - in: query
          name: redirect
          required: false
          schema:
            type: string
          description: "Path destino post-login (ej: /home)"
      responses:
        '302':
          description: Redirect to IdP authorization endpoint
          headers:
            Location:
              schema: { type: string }
              required: true
        '400':
          description: Bad request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/auth/oidc/callback:
    get:
      tags: [Auth]
      operationId: completeWebLogin
      summary: Callback OIDC; crea cookie de sesión y redirige al destino final
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: state
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirect after login (sets session cookie and CSRF cookie)
          headers:
            Location:
              schema: { type: string }
              required: true
        '400':
          description: Missing/invalid parameters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized (invalid code/state or login rejected)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # =========================
  # SESSION (ahora /api/v1)
  # =========================
  /api/v1/session/logout:
    post:
      tags: [Session]
      operationId: logoutWebSession
      summary: Cierra sesión (invalida upstream si aplica) y limpia cookies
      security:
        - cookieAuth: []
          csrfAuth: []
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden (CSRF / session)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/session/csrf:
    get:
      tags: [Session]
      operationId: getWebCsrfToken
      summary: Devuelve el CSRF token actual (o lo crea si no existe)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfTokenResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/session/refresh:
    post:
      tags: [Session]
      operationId: refreshWebSession
      summary: Rota/renueva sesión server-side y actualiza cookie
      security:
        - cookieAuth: []
          csrfAuth: []
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshSessionResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden (CSRF / session)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # =========================
  # Accounts (existente)
  # =========================
  /api/v1/accounts:
    get:
      tags: [Accounts]
      operationId: getAccountsOverview
      summary: Resumen de cuentas del customer autenticado
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountsOverviewResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/accounts/{id}/activity:
    get:
      tags: [Accounts]
      operationId: getAccountActivity
      summary: Actividad (journal entries) de una cuenta
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: page
          required: false
          schema: { type: integer }
        - in: query
          name: size
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountActivityResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # =========================
  # Onboarding (presigned)
  # =========================
  /api/v1/onboarding/intents:
    post:
      tags: [Onboarding]
      operationId: startOnboarding
      summary: Inicia onboarding (registro/KYC) — presigned S3
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnboardingIntentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingIntentResponse' }
        '400':
          description: Bad request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Schema validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/onboarding/kyc/confirm:
    post:
      tags: [Onboarding]
      operationId: confirmOnboardingKyc
      summary: Confirma KYC (verifica objetos subidos a S3)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConfirmKycRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConfirmKycResponse' }
        '400':
          description: Bad request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Schema validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/onboarding/activate:
    post:
      tags: [Onboarding]
      operationId: activateOnboarding
      summary: Activa onboarding (crea customer + account)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivateResponse' }
        '400':
          description: Bad request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Schema validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # =========================
  # Payments
  # =========================
  /api/v1/beneficiaries:
    post:
      tags: [Payments]
      operationId: createBeneficiary
      summary: Crea beneficiario (MVP)
      security:
        - cookieAuth: []
          csrfAuth: []
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBeneficiaryRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateBeneficiaryResponse' }
        '400':
          description: Bad request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Schema validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/payments:
    post:
      tags: [Payments]
      operationId: executePayment
      summary: Ejecuta un pago
      security:
        - cookieAuth: []
          csrfAuth: []
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string }
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreatePaymentRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreatePaymentResponse' }
        '400':
          description: Bad request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Schema validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/payments/{id}:
    get:
      tags: [Payments]
      operationId: getPaymentStatus
      summary: Obtiene estado/detalle de un pago
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GetPaymentResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # =========================
  # Profile
  # =========================
  /api/v1/profile:
    patch:
      tags: [Profile]
      operationId: updateProfile
      summary: Actualiza perfil del customer autenticado
      security:
        - cookieAuth: []
          csrfAuth: []
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PatchProfileRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PatchProfileResponse' }
        '400':
          description: Bad request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
