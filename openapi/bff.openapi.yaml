openapi: 3.0.3
info:
  title: BFF Web API
  version: 1.0.0
  description: |
    API del BFF para canal web (cookie session + CSRF).

servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: Auth
  - name: Session
  - name: Onboarding
  - name: Accounts
  - name: Payments
  - name: Profile
  - name: Admin
  - name: Webauthn


components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: bff_sid
      description: >
        En HTTPS el BFF puede setear __Host-bff_sid; en local/HTTP usa bff_sid.
        El cliente debe reenviar la cookie exactamente como la recibe.
    csrfAuth:
      type: apiKey
      in: header
      name: X-CSRF-Token

  headers:
    Idempotency-Key:
      schema:
        type: string
      required: true

  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "BAD_REQUEST"
        message:
          type: string
          example: "Invalid request"
        details:
          type: object
          additionalProperties: true
          nullable: true

    CsrfTokenResponse:
      type: object
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          example: "4f2c1a...csrf..."

    AccountsOverviewResponse:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountItem'

    AccountItem:
      type: object
      required: [id, product_type, currency, status, balances]
      properties:
        id:
          type: string
        product_type:
          type: string
        currency:
          type: string
        status:
          type: string
        balances:
          $ref: '#/components/schemas/AccountBalances'

    AccountBalances:
      type: object
      required: [ledger, available, hold]
      properties:
        ledger:
          type: string
        available:
          type: string
        hold:
          type: string

    AccountActivityResponse:
      type: object
      required: [items, page, size, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AccountActivityItem'
        page:
          type: integer
        size:
          type: integer
        total:
          type: integer

    AccountActivityItem:
      type: object
      required: [journal_id, booked_at]
      properties:
        journal_id:
          type: string
        booked_at:
          type: string
          format: date-time
        memo:
          type: string
          nullable: true

    OnboardingIntentRequest:
      type: object
      required:
      - email
      - phone
      - national_id
      - national_id_issue_date
      - fingerprint_code
      - id_document_front
      - selfie
      - monthly_income
      - occupation_type
      properties:
        email:
          type: string
          format: email
        phone:
          type: string
        channel:
          type: string
          nullable: true
        locale:
          type: string
          nullable: true

        national_id:
          type: string
        national_id_issue_date:
          type: string
          example: "2020-01-31"
        fingerprint_code:
          type: string

        id_document_front:
          type: string
          format: binary
          description: "Imagen frontal del documento (jpg/png)."
        selfie:
          type: string
          format: binary
          description: "Selfie del usuario (jpg/png)."

        monthly_income:
          type: number
        occupation_type:
          type: string
          enum: [student, employee, self_employed, unemployed, retired]

    OnboardingIntentResponse:
      type: object
      required: [registration_id, otp_channel_hint]
      properties:
        registration_id:
          type: string
        otp_channel_hint:
          type: string

    VerifyContactRequest:
      type: object
      required: [registration_id, otp]
      properties:
        registration_id:
          type: string
        otp:
          type: string

    ConsentsRequest:
      type: object
      required: [registration_id, accepted]
      properties:
        registration_id:
          type: string
        accepted:
          type: boolean

    ActivateRequest:
      type: object
      required: [registration_id, full_name, tin, birth_date, country, email, phone]
      properties:
        registration_id:
          type: string
        full_name:
          type: string
        tin:
          type: string
        birth_date:
          type: string
        country:
          type: string
        email:
          type: string
        phone:
          type: string

    ActivateResponse:
      type: object
      required: [customer_id, account_id, activation_ref]
      properties:
        customer_id:
          type: string
        account_id:
          type: string
        activation_ref:
          type: string

    CreateBeneficiaryRequest:
      type: object
      required: [destination_account]
      properties:
        destination_account:
          type: string
        alias:
          type: string
          nullable: true

    CreateBeneficiaryResponse:
      type: object
      required: [beneficiary_id]
      properties:
        beneficiary_id:
          type: string

    CreatePaymentRequest:
      type: object
      required: [source_account, destination_account, currency, amount]
      properties:
        source_account:
          type: string
        destination_account:
          type: string
        currency:
          type: string
        amount:
          type: string
        memo:
          type: string
          nullable: true

    CreatePaymentResponse:
      type: object
      required: [payment_id, status]
      properties:
        payment_id:
          type: string
        status:
          type: string
          enum: [pending, posted, rejected, failed]

    PaymentStep:
      type: object
      required: [step, state, attempted_at]
      properties:
        step:
          type: string
        state:
          type: string
        details_json:
          type: string
          nullable: true
        attempted_at:
          type: string
          format: date-time

    GetPaymentResponse:
      type: object
      required: [payment_id, status, idempotency_key, source_account, destination_account, currency, amount, steps, created_at]
      properties:
        payment_id:
          type: string
        status:
          type: string
        idempotency_key:
          type: string
        source_account:
          type: string
        destination_account:
          type: string
        currency:
          type: string
        amount:
          type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/PaymentStep'
        created_at:
          type: string
          format: date-time

    PatchProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        preferences:
          type: array
          nullable: true
          items:
            type: object
            required: [channel, opt_in]
            properties:
              channel:
                type: string
                enum: [email, sms, push]
              opt_in:
                type: boolean

    PatchProfileResponse:
      type: object
      required: [updated]
      properties:
        updated:
          type: boolean

    SandboxTopupRequest:
      type: object
      required: [account_id, currency, amount]
      properties:
        account_id:
          type: string
        currency:
          type: string
        amount:
          type: string
        memo:
          type: string
          nullable: true

    SandboxTopupResponse:
      type: object
      required: [journal_id, status]
      properties:
        journal_id:
          type: string
        status:
          type: string

    WhoamiResponse:
      type: object
      required: [subject_id_oidc, roles, user_status, mfa_required, mfa_verified]
      properties:
        subject_id_oidc:
          type: string
        customer_id:
          type: string
          nullable: true
        roles:
          type: array
          items:
            type: string
        user_status:
          type: string
        mfa_required:
          type: boolean
        mfa_verified:
          type: boolean

    SimpleStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    RefreshSessionResponse:
      type: object
      required: [session_expires_in]
      properties:
        session_expires_in:
          type: integer
          format: int64
          description: "TTL de la sesión (segundos). Cookie rotada/extendida."

    BeginWebauthnRegistrationRequest:
      type: object
      properties:
        device_name:
          type: string
          nullable: true

    BeginWebauthnRegistrationResponse:
      type: object
      required: [request_id, options_json]
      properties:
        request_id:
          type: string
        options_json:
          type: string
          description: "JSON para navigator.credentials.create()"

    FinishWebauthnRegistrationRequest:
      type: object
      required: [request_id, credential_json]
      properties:
        request_id:
          type: string
        credential_json:
          type: string
          description: "JSON resultante de navigator.credentials.create()"

    BeginWebauthnAssertionResponse:
      type: object
      required: [request_id, options_json]
      properties:
        request_id:
          type: string
        options_json:
          type: string
          description: "JSON para navigator.credentials.get()"

    FinishWebauthnAssertionRequest:
      type: object
      required: [request_id, credential_json]
      properties:
        request_id:
          type: string
        credential_json:
          type: string
          description: "JSON resultante de navigator.credentials.get()"

    WebauthnSuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean


paths:
  # ---------------------------
  # AUTH (ANTES MANUAL)
  # ---------------------------
  /bff/login/start:
    get:
      tags: [Auth]
      operationId: startWebLogin
      summary: Inicia OIDC login y redirige al IdP
      description: |
        Redirige al Authorization URL del IdP. `redirect` es el path post-login que el BFF sanitiza.
      parameters:
        - in: query
          name: redirect
          required: false
          schema:
            type: string
          description: "Path destino post-login (ej: /home)"
      responses:
        '302':
          description: Redirect to IdP authorization endpoint
          headers:
            Location:
              schema: { type: string }
              required: true
        '400':
          description: Bad request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /bff/login/callback:
    get:
      tags: [Auth]
      operationId: completeWebLogin
      summary: Callback OIDC; crea cookie de sesión y redirige al destino final
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: state
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirect after login (sets session cookie and CSRF cookie)
          headers:
            Location:
              schema: { type: string }
              required: true
        '400':
          description: Missing/invalid parameters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized (invalid code/state or login rejected)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # ---------------------------
  # SESSION (ANTES MANUAL)
  # ---------------------------
  /bff/session/logout:
    post:
      tags: [Session]
      operationId: logoutWebSession
      summary: Cierra sesión (invalida upstream si aplica) y limpia cookies
      security:
        - cookieAuth: []
          csrfAuth: []
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '204':
          description: No Content
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden (CSRF / session)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /bff/session/csrf:
    get:
      tags: [Session]
      operationId: getWebCsrfToken
      summary: Devuelve el CSRF token actual (o lo crea si no existe)
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfTokenResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
  /bff/session/refresh:
    post:
      tags: [Session]
      operationId: refreshWebSession
      summary: Rota/renueva sesión server-side y actualiza cookie
      security:
        - cookieAuth: []
          csrfAuth: []
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshSessionResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden (CSRF / session)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /bff/webauthn/registration/begin:
    post:
      tags: [Webauthn]
      operationId: beginWebauthnRegistration
      summary: Inicia registro WebAuthn (passkey)
      security:
        - cookieAuth: []
          csrfAuth: []
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BeginWebauthnRegistrationRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeginWebauthnRegistrationResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /bff/webauthn/registration/finish:
    post:
      tags: [Webauthn]
      operationId: finishWebauthnRegistration
      summary: Finaliza registro WebAuthn
      security:
        - cookieAuth: []
          csrfAuth: []
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinishWebauthnRegistrationRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebauthnSuccessResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /bff/webauthn/assertion/begin:
    post:
      tags: [Webauthn]
      operationId: beginWebauthnAssertion
      summary: Inicia assertion WebAuthn (MFA)
      security:
        - cookieAuth: []
          csrfAuth: []
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BeginWebauthnAssertionResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /bff/webauthn/assertion/finish:
    post:
      tags: [Webauthn]
      operationId: finishWebauthnAssertion
      summary: Finaliza assertion WebAuthn (MFA)
      security:
        - cookieAuth: []
          csrfAuth: []
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinishWebauthnAssertionRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WebauthnSuccessResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }


  # ---------------------------
  # EXISTENTES (CORRIGIENDO SECURITY CSRF = AND)
  # ---------------------------
  /api/v1/accounts:
    get:
      tags: [Accounts]
      operationId: getAccountsOverview
      summary: Resumen de cuentas del customer autenticado
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountsOverviewResponse'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/accounts/{id}/activity:
    get:
      tags: [Accounts]
      operationId: getAccountActivity
      summary: Actividad (journal entries) de una cuenta
      security:
        - cookieAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
        - in: query
          name: page
          required: false
          schema: { type: integer }
        - in: query
          name: size
          required: false
          schema: { type: integer }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountActivityResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/onboarding/intents:
    post:
      tags: [Onboarding]
      operationId: startOnboarding
      summary: Inicia onboarding (registro/KYC)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/OnboardingIntentRequest'
            encoding:
              id_document_front:
                contentType: image/jpeg, image/png
              selfie:
                contentType: image/jpeg, image/png
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OnboardingIntentResponse' }
        '400':
          description: Bad request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Schema validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/onboarding/verify-contact:
    post:
      tags: [Onboarding]
      operationId: verifyOnboardingContact
      summary: Verifica OTP/contacto (stub por ahora)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyContactRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleStatusResponse' }
        '400':
          description: Bad request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Schema validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/onboarding/consents:
    post:
      tags: [Onboarding]
      operationId: registerOnboardingConsents
      summary: Registra consentimientos (stub por ahora)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConsentsRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SimpleStatusResponse' }
        '400':
          description: Bad request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Schema validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/onboarding/activate:
    post:
      tags: [Onboarding]
      operationId: activateOnboarding
      summary: Activa onboarding (crea customer + account)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActivateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivateResponse' }
        '400':
          description: Bad request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Schema validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/beneficiaries:
    post:
      tags: [Payments]
      operationId: createBeneficiary
      summary: Crea beneficiario (MVP)
      security:
        - cookieAuth: []
          csrfAuth: []
      parameters:
        - in: header
          name: X-CSRF-Token
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBeneficiaryRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CreateBeneficiaryResponse' }
        '400':
          description: Bad request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '422':
          description: Schema validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/payments:
    post:
      tags: [Payments]
      operationId: executePayment
      summary: Ejecuta un pago
      security:
        - cookieAuth: []
          csrfAuth: []
