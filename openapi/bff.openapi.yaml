        service: bank.accounts.v1.AccountsService
        method: ListAccountStatement
      x-bff-orchestration:
        calls:
          - service: identity
            rpc: OidcAuthService.RefreshSession
            when: "conditional"
            notes: "Si no hay access_token válido para downstream."
          - service: accounts
            rpc: AccountsService.ListAccountStatement
            when: always
            notes: "Accounts orquesta consulta al ledger internamente."
      x-audit:
        action: accounts.statement.list
        route_template: /api/v1/accounts/{id}/statement
        critical: false
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string, format: uuid }
        - in: query
          name: from
          required: false
          schema: { type: string, format: date-time }
          description: "Inicio del rango (RFC3339)."
        - in: query
          name: to
          required: false
          schema: { type: string, format: date-time }
          description: "Fin del rango (RFC3339)."
        - $ref: '#/components/parameters/PageParam'
