openapi: 3.0.3
info:
  title: BFF Web API
  version: 1.0.0
  description: |
    API del BFF para canal web (cookie session + CSRF).
    Onboarding usa flujo presigned S3 (no se suben bytes al BFF).

    Convenciones:
    - Montos: string decimal "canonical" (sin notación científica). Ej: "10.50"
    - Idempotencia: header Idempotency-Key en endpoints mutadores con reintentos.
    - Correlation: el BFF propaga correlation_id a micros y lo devuelve como header.

servers:
  - url: http://localhost:8080
    description: Local

tags:
  - name: Auth
  - name: Session
  - name: Onboarding
  - name: Accounts
  - name: Payments
  - name: Profile
  - name: Admin

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session_id
      description: >
        En HTTPS el BFF puede setear __Host-session_id; en local/HTTP usa session_id.
        El cliente debe reenviar la cookie exactamente como la recibe.
    csrfAuth:
      type: apiKey
      in: header
      name: X-CSRF-Token

  headers:
    X-Correlation-Id:
      description: Correlation ID propagado extremo a extremo (BFF -> micros).
      schema:
        type: string
    Idempotency-Key:
      description: Clave de idempotencia para reintentos seguros.
      schema:
        type: string

  parameters:
    XCsrfToken:
      in: header
      name: X-CSRF-Token
      required: true
      schema: { type: string }
    IdempotencyKeyRequired:
      in: header
      name: Idempotency-Key
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }

    IdempotencyKeyOptional:
      in: header
      name: Idempotency-Key
      required: false
      schema: { type: string, minLength: 8, maxLength: 128 }
    PageParam:
      in: query
      name: page
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    SizeParam:
      in: query
      name: size
      required: false
      schema: { type: integer, minimum: 1, maximum: 200, default: 20 }

  schemas:
    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: "BAD_REQUEST"
        message:
          type: string
          example: "Invalid request"
        details:
          type: object
          additionalProperties: true
          nullable: true

    CsrfTokenResponse:
      type: object
      required: [csrf_token]
      properties:
        csrf_token:
          type: string
          example: "4f2c1a...csrf..."

    SimpleStatusResponse:
      type: object
      required: [status]
      properties:
        status:
          type: string

    # =========================
    # Accounts
    # =========================
    AccountsOverviewResponse:
      type: object
      required: [accounts]
      properties:
        accounts:
          type: array
          items:
            $ref: '#/components/schemas/AccountItem'

    AccountItem:
      type: object
      required: [id, product_type, currency, status, balances]
      properties:
        id: { type: string }
        account_number:
          type: string
          example: "000000012345"
          description: "Número de cuenta normalizado (12 dígitos)."
        product_type: { type: string, description: "Ej: CHECKING | SAVINGS" }
        currency: { type: string, description: "ISO-4217" }
        status: { type: string, example: "active" }
        balances:
          $ref: '#/components/schemas/AccountBalances'

    AccountBalances:
      type: object
      required: [ledger, available, hold]
      properties:
        ledger:
          type: string
          description: "Decimal string"
        available:
          type: string
          description: "Decimal string"
        hold:
          type: string
          description: "Decimal string"

    PatchAccountLimitsHttpRequest:
      type: object
      description: |
        Actualiza límites diarios de entrada/salida.
        Campos omitidos o null => no se modifican.
      properties:
        daily_out:
          type: string
          nullable: true
          description: "Decimal string (>=0). Ej: '500.00'"
        daily_in:
          type: string
          nullable: true
          description: "Decimal string (>=0). Ej: '1000.00'"

    PatchAccountLimitsHttpResponse:
      type: object
      required: [account_id, daily_out, daily_in]
      properties:
        account_id: { type: string }
        daily_out: { type: string }
        daily_in: { type: string }

    # -------------------------
    # NUEVO: Lookup por account_number (destinatario)
    # -------------------------
    AccountLookupResponse:
      type: object
      required: [account]
      properties:
        account:
          $ref: '#/components/schemas/AccountLookupItem'

    AccountLookupItem:
      type: object
      required: [account_id, account_number, display_name, product_type, currency, status]
      properties:
        account_id: { type: string, format: uuid }
        account_number:
          type: string
          example: "000000012345"
          description: "Número de cuenta normalizado (12 dígitos)."
        display_name:
          type: string
          example: "Juan Perez"
          description: "Nombre mostrado del titular (demo)."
        product_type:
          type: string
          example: "CHECKING"
        currency:
          type: string
          minLength: 3
          maxLength: 3
        status:
          type: string
          example: "active"

    # -------------------------
    # NUEVO: Estado de cuenta / Movimientos (Statement)
    # -------------------------
    AccountStatementResponse:
      type: object
      required: [items, page, size]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/StatementItem'
        page:
          type: integer
          minimum: 1
        size:
          type: integer
          minimum: 1
        total:
          type: integer
          nullable: true
          description: "Opcional si no hay total disponible."

    StatementItem:
      type: object
      required: [journal_id, booked_at, currency, direction, amount, kind]
      properties:
        journal_id:
          type: string
          description: "Journal/entry id del ledger"
        booked_at:
          type: string
          format: date-time
        currency:
          type: string
          minLength: 3
          maxLength: 3
        direction:
          type: string
          enum: [debit, credit]
        amount:
          type: string
          description: "Decimal string"
        kind:
          type: string
          example: "transfer"
        memo:
          type: string
          nullable: true
          description: "Referencia externa / external_ref"
        counterparty_account_id:
          type: string
          nullable: true
          format: uuid
        counterparty:
          $ref: '#/components/schemas/CounterpartyView'
          nullable: true

    CounterpartyView:
      type: object
      required: [account_id, account_number, display_name, account_type]
      properties:
        account_id: { type: string, format: uuid }
        account_number: { type: string, example: "000000009999" }
        display_name: { type: string, example: "Maria Lopez" }
        account_type: { type: string, example: "checking" }

    # =========================
    # Onboarding (Presigned S3)
    # =========================
    OccupationType:
      type: string
      enum: [student, employee, self_employed, unemployed, retired]

    RegistrationState:
      type: string
      enum: [started, contact_verified, consented, activated, rejected, unspecified]

    KycDocType:
      type: string
      enum: [id_front, selfie]

    KycUploadStatus:
      type: string
      enum: [pending, confirmed, unspecified]

    PresignedHeader:
      type: object
      required: [name, value]
      properties:
        name: { type: string }
        value: { type: string }

    PresignedUpload:
      type: object
      required: [doc_type, bucket, key, upload_url, headers, max_bytes, content_type, expires_in_seconds]
      properties:
        doc_type: { $ref: '#/components/schemas/KycDocType' }
        bucket: { type: string }
        key: { type: string }
        upload_url:
          type: string
          format: uri
        headers:
          type: array
          items: { $ref: '#/components/schemas/PresignedHeader' }
        max_bytes:
          type: integer
          format: int64
        content_type: { type: string }
        expires_in_seconds:
          type: integer
          format: int64

    OnboardingIntentRequest:
      type: object
      required:
        - email
        - phone
        - national_id
        - national_id_issue_date
        - fingerprint_code
        - monthly_income
        - occupation_type
      properties:
        email: { type: string, format: email }
        phone: { type: string }
        channel:
          type: string
          nullable: true
          description: "Ej: web"
        locale:
          type: string
          nullable: true

        national_id: { type: string }
        national_id_issue_date:
          type: string
          example: "2020-01-31"
        fingerprint_code: { type: string }

        monthly_income:
          type: number
        occupation_type:
          $ref: '#/components/schemas/OccupationType'

        id_front_content_type:
          type: string
          nullable: true
          example: "image/jpeg"
        selfie_content_type:
          type: string
          nullable: true
          example: "image/jpeg"

    OnboardingIntentResponse:
      type: object
      required: [registration_id, state, uploads]
      properties:
        registration_id: { type: string }
        state: { $ref: '#/components/schemas/RegistrationState' }
        created_at:
          type: string
          format: date-time
          nullable: true
        uploads:
          type: array
          items: { $ref: '#/components/schemas/PresignedUpload' }
        correlation_id:
          type: string
          nullable: true

    UploadedObject:
      type: object
      required: [doc_type, bucket, key]
      properties:
        doc_type: { $ref: '#/components/schemas/KycDocType' }
        bucket: { type: string }
        key: { type: string }
        etag:
          type: string
          nullable: true
        size_bytes:
          type: integer
          format: int64
          nullable: true
        content_type:
          type: string
          nullable: true

    ConfirmKycRequest:
      type: object
      required: [registration_id, objects]
      properties:
        registration_id: { type: string }
        channel:
          type: string
          nullable: true
          description: "Ej: web"
        objects:
          type: array
          items: { $ref: '#/components/schemas/UploadedObject' }

    KycObjectStatus:
      type: object
      required: [doc_type, status, bucket, key]
      properties:
        doc_type: { $ref: '#/components/schemas/KycDocType' }
        status: { $ref: '#/components/schemas/KycUploadStatus' }
        bucket: { type: string }
        key: { type: string }
        etag:
          type: string
          nullable: true

    ConfirmKycResponse:
      type: object
      required: [registration_id, state, statuses]
      properties:
        registration_id: { type: string }
        state: { $ref: '#/components/schemas/RegistrationState' }
        statuses:
          type: array
          items: { $ref: '#/components/schemas/KycObjectStatus' }
        confirmed_at:
          type: string
          format: date-time
          nullable: true
        correlation_id:
          type: string
          nullable: true

    ActivateRequest:
      type: object
      required: [registration_id, full_name, tin, birth_date, country, email, phone]
      properties:
        registration_id: { type: string }
        full_name: { type: string }
        tin: { type: string }
        birth_date: { type: string, example: "1999-12-31" }
        country: { type: string, minLength: 2, maxLength: 2 }
        email: { type: string, format: email }
        phone: { type: string }
        accepted_terms:
          type: boolean
          nullable: true
          description: "Recomendado si tu UI exige aceptación."

    ActivateResponse:
      type: object
      required: [customer_id, account_id, activation_ref]
      properties:
        customer_id: { type: string }
        account_id: { type: string }
        activation_ref: { type: string }
        correlation_id:
          type: string
          nullable: true

    # =========================
    # Payments
    # =========================
    CreateBeneficiaryRequest:
      type: object
      required: [destination_account]
      properties:
        destination_account: { type: string }
        alias:
          type: string
          nullable: true

    CreateBeneficiaryResponse:
      type: object
      required: [beneficiary_id]
      properties:
        beneficiary_id: { type: string }

    CreatePaymentRequest:
      type: object
      required: [source_account, destination_account, currency, amount]
      properties:
        source_account: { type: string }
        destination_account: { type: string }
        currency: { type: string, minLength: 3, maxLength: 3 }
        amount:
          type: string
          description: "Decimal string"
        memo:
          type: string
          nullable: true

    CreatePaymentResponse:
      type: object
      required: [payment_id, status]
      properties:
        payment_id: { type: string }
        status:
          type: string
          enum: [pending, posted, rejected, failed]

    PaymentStep:
      type: object
      required: [step, state, attempted_at]
      properties:
        step: { type: string }
        state: { type: string }
        details_json:
          type: string
          nullable: true
        attempted_at:
          type: string
          format: date-time

    GetPaymentResponse:
      type: object
      required: [payment_id, status, idempotency_key, source_account, destination_account, currency, amount, steps, created_at]
      properties:
        payment_id: { type: string }
        status: { type: string }
        idempotency_key: { type: string }
        source_account: { type: string }
        destination_account: { type: string }
        currency: { type: string }
        amount: { type: string }
        steps:
          type: array
          items: { $ref: '#/components/schemas/PaymentStep' }
        created_at:
          type: string
          format: date-time

    # =========================
    # Profile
    # =========================
    PatchProfileRequest:
      type: object
      properties:
        full_name:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        preferences:
          type: array
          nullable: true
          items:
            type: object
            required: [channel, opt_in]
            properties:
              channel:
                type: string
                enum: [email, sms, push]
              opt_in:
                type: boolean

    PatchProfileResponse:
      type: object
      required: [updated]
      properties:
        updated:
          type: boolean

    # =========================
    # Session / Whoami
    # =========================
    WhoamiResponse:
      type: object
      required: [subject_id_oidc, roles, user_status]
      properties:
        subject_id_oidc: { type: string }
        customer_id:
          type: string
          nullable: true
        roles:
          type: array
          items: { type: string }
        user_status: { type: string }

    RefreshSessionResponse:
      type: object
      required: [session_expires_in]
      properties:
        session_expires_in:
          type: integer
          format: int64
          description: "TTL de la sesión (segundos). Cookie rotada/extendida."

paths:
  # =========================
  # AUTH
  # =========================
  /api/v1/auth/oidc/start:
    get:
      tags: [Auth]
      operationId: startWebLogin
      summary: Inicia OIDC login y redirige al IdP
      description: |
        Orquestación:
        - BFF llama a Identity para obtener authorization_url.
        - BFF responde 302 Location.
      x-grpc:
        service: bank.identity.v1.OidcAuthService
        method: StartOidcLogin
      x-bff-orchestration:
        calls:
          - service: identity
            rpc: OidcAuthService.StartOidcLogin
            when: always
            notes: "Devuelve authorization_url y state."
      x-audit:
        action: auth.oidc.start
        route_template: /api/v1/auth/oidc/start
        critical: false
      parameters:
        - in: query
          name: redirect
          required: false
          schema: { type: string }
          description: "Path destino post-login (ej: /home)"
      responses:
        '302':
          description: Redirect to IdP authorization endpoint
          headers:
            Location:
              schema: { type: string }
              required: true
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        '400':
          description: Bad request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/auth/oidc/callback:
    get:
      tags: [Auth]
      operationId: completeWebLogin
      summary: Callback OIDC; crea cookie de sesión y redirige al destino final
      description: |
        Orquestación:
        - BFF llama a Identity.CompleteOidcLogin(code,state,...).
        - BFF setea cookie session_id y materializa CSRF (cookie/endpoint /session/csrf).
        - BFF redirige a redirect_after_login.
      x-grpc:
        service: bank.identity.v1.OidcAuthService
        method: CompleteOidcLogin
      x-bff-orchestration:
        calls:
          - service: identity
            rpc: OidcAuthService.CompleteOidcLogin
            when: always
            notes: "Crea sesión server-side y retorna session_id + redirect."
      x-audit:
        action: auth.oidc.complete
        route_template: /api/v1/auth/oidc/callback
        critical: true
      parameters:
        - in: query
          name: code
          required: true
          schema: { type: string }
        - in: query
          name: state
          required: true
          schema: { type: string }
      responses:
        '302':
          description: Redirect after login (sets session cookie and CSRF cookie)
          headers:
            Location:
              schema: { type: string }
              required: true
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        '400':
          description: Missing/invalid parameters
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '401':
          description: Unauthorized (invalid code/state or login rejected)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # =========================
  # SESSION
  # =========================
  /api/v1/session/logout:
    post:
      tags: [Session]
      operationId: logoutWebSession
      summary: Cierra sesión y limpia cookies
      security:
        - cookieAuth: []
          csrfAuth: []
      x-grpc:
        service: bank.identity.v1.OidcAuthService
        method: LogoutSession
      x-bff-orchestration:
        calls:
          - service: identity
            rpc: OidcAuthService.LogoutSession
            when: always
            notes: "Invalida sesión server-side."
      x-audit:
        action: session.logout
        route_template: /api/v1/session/logout
        critical: true
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '204':
          description: No Content
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden (CSRF / session)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/session/csrf:
    get:
      tags: [Session]
      operationId: getWebCsrfToken
      summary: Devuelve el CSRF token actual (o lo crea si no existe)
      security:
        - cookieAuth: []
      x-bff-orchestration:
        calls:
          - service: bff
            rpc: none
            when: always
            notes: "CSRF token se gestiona en BFF (cookie/secret) y se devuelve al cliente."
      x-audit:
        action: session.csrf.get
        route_template: /api/v1/session/csrf
        critical: false
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CsrfTokenResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden (CSRF / session)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        

  /api/v1/session/refresh:
    post:
      tags: [Session]
      operationId: refreshWebSession
      summary: Rota/renueva sesión server-side y actualiza cookie
      security:
        - cookieAuth: []
          csrfAuth: []
      x-grpc:
        service: bank.identity.v1.OidcAuthService
        method: RefreshSession
      x-bff-orchestration:
        calls:
          - service: identity
            rpc: OidcAuthService.RefreshSession
            when: always
            notes: "Rota sesión y devuelve access_token para downstream."
      x-audit:
        action: session.refresh
        route_template: /api/v1/session/refresh
        critical: true
      parameters:
        - $ref: '#/components/parameters/XCsrfToken'
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefreshSessionResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden (CSRF / session)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '502':
          description: Upstream error (Identity)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  /api/v1/session:
    get:
      tags: [Session]
      operationId: getCurrentSession
      summary: Identidad y estado de la sesión actual
      security:
        - cookieAuth: []
      x-grpc:
        service: bank.identity.v1.OidcAuthService
        method: GetSessionInfo
      x-bff-orchestration:
        calls:
          - service: identity
            rpc: OidcAuthService.GetSessionInfo
            when: always
            notes: "Devuelve roles + customer_id (si ya está ligado)."
          - service: identity
            rpc: OidcAuthService.RefreshSession
            when: "conditional"
            notes: "Si access_token expiró y se requiere downstream."
      x-audit:
        action: session.info
        route_template: /api/v1/session
        critical: false
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/X-Correlation-Id'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WhoamiResponse' }
        '401':
          description: Unauthorized
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }
        '403':
          description: Forbidden
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorResponse' }

  # =========================
  # Accounts
  # =========================
  /api/v1/accounts:
    get:
      tags: [Accounts]
      operationId: getAccountsOverview
      summary: Resumen de cuentas del customer autenticado
      security:
        - cookieAuth: []
      description: |
        Orquestación:
        - BFF resuelve customer_id desde la sesión (Identity.GetSessionInfo o cache local).
        - (Opcional) RefreshSession si el access_token para downstream expiró.
        - Accounts.ListAccounts(customer_id).
      x-grpc:
        service: bank.accounts.v1.AccountsService
        method: ListAccounts
      x-bff-orchestration:
        calls:
          - service: identity
            rpc: OidcAuthService.GetSessionInfo
            when: "conditional"
            notes: "Si el BFF no tiene customer_id en cache."
          - service: identity
            rpc: OidcAuthService.RefreshSession
            when: "conditional"
            notes: "Si no hay access_token válido para llamar Accounts."
          - service: accounts
            rpc: AccountsService.ListAccounts
            when: always
            notes: "Retorna lista con balances."
      x-audit:
        action: accounts.list
        route_template: /api/v1/accounts
        critical: false
      responses:
        '200':
          description: OK
          headers:
            X-Correlation-Id: { $ref: '#/components/headers/X-Correlation-Id' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccountsOverviewResponse' }
        '401':
