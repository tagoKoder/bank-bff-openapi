name: publish-npm

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://npm.pkg.github.com"

      - name: Set package version from tag
        run: |
          TAG=${GITHUB_REF_NAME#v}
          node -e "const fs=require('fs'); const p=require('./package.json'); p.version='${TAG}'; fs.writeFileSync('package.json', JSON.stringify(p,null,2));"

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
